<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PipTCG</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6e6e73;
    --accent: #0a66c2;
    --rule: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131315;
      --fg: #ececf1;
      --muted: #9a9aa2;
      --accent: #7ab8f5;
      --rule: #2c2c31;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 4.5rem 1.25rem 1rem;
    text-align: center;
  }
  h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 0.5rem; }
  .tagline { color: var(--muted); margin: 0 0 2.5rem; font-size: 1.05rem; }
  nav.pages ul { list-style: none; margin: 0; padding: 0; }
  nav.pages li { margin: 0.9rem 0; }
  nav.pages a { color: var(--accent); font-size: 1.1rem; text-decoration: none; }
  nav.pages a:hover, nav.pages a:focus { text-decoration: underline; }
  footer {
    max-width: 720px;
    margin: 3.5rem auto 0;
    padding: 1.5rem 1.25rem 3rem;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
</style>
</head>
<body>
<script>
  // Supabase auth redirects fall back to the Site URL (this page) in some
  // error paths; recovery fragments belong on reset.html where they get a
  // proper explanation / app handoff instead of a silent landing page.
  (function () {
    var h = location.hash || '';
    if (h.indexOf('error') !== -1 || (h.indexOf('access_token') !== -1 && h.indexOf('type=recovery') !== -1)) {
      location.replace('reset.html' + h);
    }
  })();
</script>
<main>
  <h1>PipTCG</h1>
  <p class="tagline">Buy, sell, and trade physical trading cards with collectors near you.</p>
  <nav class="pages">
    <ul>
      <li><a href="support.html">Support</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms of Service</a></li>
    </ul>
  </nav>
</main>
<footer>&copy; 2026 PipTCG &middot; Last updated July 6, 2026</footer>
</body>
</html>
